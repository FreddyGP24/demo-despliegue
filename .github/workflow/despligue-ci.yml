name: Comprobar Script y preparar version

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Ejecutar Script
        shell: pwsh
        run: ./desplegar.ps1 -RutaPHP 'php'
      - name: Guardar version preparada
        uses: actions/upload-artifact@v3
        with:
          name: version-preparada
          path: pruebas/index.php
          if-no-files-found: error
